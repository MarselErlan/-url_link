<!DOCTYPE html>
<html>
<head>
    <title>Extension Debug Test</title>
</head>
<body>
    <h1>Chrome Extension Debug Test</h1>
    <div id="debug-info"></div>
    
    <script>
        // Simulate what the extension should do
        async function testExtensionBehavior() {
            const debugDiv = document.getElementById('debug-info');
            
            debugDiv.innerHTML += '<h2>Testing Extension Behavior...</h2>';
            
            // Test 1: Check if we can access Chrome APIs (this won't work in regular browser)
            debugDiv.innerHTML += '<p>1️⃣ Testing Chrome API access...</p>';
            
            if (typeof chrome !== 'undefined' && chrome.identity) {
                debugDiv.innerHTML += '<p>✅ Chrome APIs available</p>';
                
                // Test Chrome identity
                chrome.identity.getProfileUserInfo((userInfo) => {
                    debugDiv.innerHTML += `<p>✅ Chrome identity result: ${JSON.stringify(userInfo)}</p>`;
                    
                    if (userInfo.email) {
                        debugDiv.innerHTML += `<p>✅ Email found: ${userInfo.email}</p>`;
                        debugDiv.innerHTML += '<p>✅ Extension should use this email as user_id</p>';
                    } else {
                        debugDiv.innerHTML += '<p>❌ No email found in Chrome identity</p>';
                        debugDiv.innerHTML += '<p>❌ Extension will generate unique ID instead</p>';
                    }
                });
            } else {
                debugDiv.innerHTML += '<p>❌ Chrome APIs not available (this is normal in regular browser)</p>';
                debugDiv.innerHTML += '<p>ℹ️ This test needs to be run in Chrome extension context</p>';
            }
            
            // Test 2: Simulate API call with ericabram33@gmail.com
            debugDiv.innerHTML += '<p>2️⃣ Testing API call with ericabram33@gmail.com...</p>';
            
            try {
                const response = await fetch('https://job-tracker-backend-production-acb1.up.railway.app/api/stats', {
                    headers: { 'x-user-id': 'ericabram33@gmail.com' }
                });
                const stats = await response.json();
                debugDiv.innerHTML += `<p>✅ API response: ${JSON.stringify(stats)}</p>`;
                
                if (stats.total_urls !== '0') {
                    debugDiv.innerHTML += '<p>✅ Backend has data for ericabram33@gmail.com</p>';
                } else {
                    debugDiv.innerHTML += '<p>❌ Backend has no data for ericabram33@gmail.com</p>';
                }
            } catch (error) {
                debugDiv.innerHTML += `<p>❌ API call failed: ${error.message}</p>`;
            }
            
            // Test 3: Instructions for user
            debugDiv.innerHTML += '<h2>Instructions for Testing:</h2>';
            debugDiv.innerHTML += '<p>1. Open Chrome Extension popup</p>';
            debugDiv.innerHTML += '<p>2. Check browser console for debug messages</p>';
            debugDiv.innerHTML += '<p>3. Look for "Chrome identity result:" message</p>';
            debugDiv.innerHTML += '<p>4. Check if email is found in the result</p>';
        }
        
        // Run the test
        testExtensionBehavior();
    </script>
</body>
</html>
