<!DOCTYPE html>
<html>
<head>
    <title>Test Extension Request</title>
</head>
<body>
    <h1>Test Extension Request</h1>
    <button id="testBtn">Test API Request</button>
    <div id="result"></div>

    <script>
        const API_BASE_URL = 'https://job-tracker-backend-production-acb1.up.railway.app';
        
        document.getElementById('testBtn').addEventListener('click', async () => {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                console.log('Testing API request...');
                const response = await fetch(`${API_BASE_URL}/api/stats`, {
                    headers: {
                        'x-user-id': 'ericabram33@gmail.com'
                    }
                });
                
                console.log('Response status:', response.status);
                console.log('Response ok:', response.ok);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('Data received:', data);
                
                resultDiv.innerHTML = `
                    <h3>Success!</h3>
                    <p>Total URLs: ${data.total_urls}</p>
                    <p>Applied: ${data.applied_count}</p>
                    <p>Not Applied: ${data.not_applied_count}</p>
                `;
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `<h3>Error:</h3><p>${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
